<p class="h3 fw-bold text-primary text-center mt-3">Master User</p>

<div class="container">
  <button class="btn btn-success mb-3" (click)="addButton(modalAdd)">Add Data</button>

  <div class="table-responsive">
    <table class="table table-hover table-striped table-bordered shadow-lg rounded-3">
      <thead class="table-primary">
        <tr>
          <th scope="col">No.</th>
          <th scope="col">Name</th>
          <th scope="col">Category ID</th>
          <th scope="col">Description</th>
          <th scope="col">Progress</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody class="bg-white">
        <tr *ngFor="let user of userData; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ user.title }}</td>
          <td>{{ user.category_id }}</td>
          <td>{{ user.description }}</td>
          <td>{{ user.progress }}%</td>
          <td>
            <!-- Edit Button -->
            <button class="btn btn-primary btn-sm me-2" (click)="editUser(user.id)">
              <i class="bi bi-pencil"></i> Edit
            </button>
            
            <!-- Delete Button -->
            <button class="btn btn-danger btn-sm" (click)="deleteUser(user.id)">
              <i class="bi bi-trash"></i> Delete
            </button>
          </td>
        </tr>
      </tbody>
      
    </table>
  </div>
</div>

<ng-template #modalAdd let-modal>
  <div class="modal-header">
    ADD DATA
  </div>

  <div class="modal-body">
    <form [formGroup]="addForm" (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="mb-3">
        <label class="form-label" for="title">Title</label>
        <input type="text" class="form-control" id="title" placeholder="Application Name" required 
               formControlName="title" [ngClass]="{ 'is-invalid': addForm.get('title')?.invalid && addForm.get('title')?.touched }">
        <div *ngIf="addForm.get('title')?.invalid && addForm.get('title')?.touched" class="invalid-feedback">
          <div *ngIf="addForm.get('title')?.errors?.['required']">Title is required</div>
        </div>
      </div>

      <div class="mb-3">
        <label for="category_id" class="form-label" display="flex">Category</label>
        <ng-select [items]="categoriesList"
           bindLabel="category"
           bindValue="id"
           placeholder="Select Category"
           formControlName="category_id"
           [ngClass]="{ 'is-invalid': addForm.get('category_id')?.invalid && addForm.get('category_id')?.touched }">
        </ng-select>
        <div *ngIf="addForm.get('category_id')?.invalid && addForm.get('category_id')?.touched" class="invalid-feedback">
          <div *ngIf="addForm.get('category_id')?.errors?.['required']">Category is required</div>
        </div>
      </div>
      

      <div class="mb-3">
        <label class="form-label" for="description">Description</label>
        <input type="text" class="form-control" id="description" placeholder="Description" required 
               formControlName="description" [ngClass]="{ 'is-invalid': addForm.get('description')?.invalid && addForm.get('description')?.touched }">
        <div *ngIf="addForm.get('description')?.invalid && addForm.get('description')?.touched" class="invalid-feedback">
          <div *ngIf="addForm.get('description')?.errors?.['required']">Description is required</div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="progress">Progress</label>
        <input type="number" class="form-control" id="progress" placeholder="Progress" required 
               formControlName="progress" [ngClass]="{ 'is-invalid': addForm.get('progress')?.invalid && addForm.get('progress')?.touched }">
        <div *ngIf="addForm.get('progress')?.invalid && addForm.get('progress')?.touched" class="invalid-feedback">
          <div *ngIf="addForm.get('progress')?.errors?.['required']">Progress is required</div>
        </div>
      </div>

      <div class="mb-2 mt-4">
        <button class="btn btn-success w-100" type="submit">Submit</button>
      </div>
    </form>
  </div>
</ng-template>
